worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Use request_id as the generated correlation ID when the client does not supply one
    map $http_correlation_id $correlation_id_final {
        ""      $request_id;
        default $http_correlation_id;
    }

    log_format json_access escape=json
        '{'
            '"timestamp":"$time_iso8601",'
            '"service_name":"nginx",'
            '"correlation_id":"$correlation_id_final",'
            '"remote_addr":"$remote_addr",'
            '"request_method":"$request_method",'
            '"request_uri":"$request_uri",'
            '"status":$status,'
            '"request_time":$request_time,'
            '"upstream_addr":"$upstream_addr",'
            '"upstream_response_time":"$upstream_response_time"'
        '}';

    access_log /dev/stdout json_access;
    error_log  /dev/stderr warn;

    server {
        listen 80;

        # ── Service routes ────────────────────────────────────────────────────

        location /products {
            proxy_pass         http://product-service:8001;
            proxy_set_header   Correlation-ID $correlation_id_final;
            proxy_set_header   Host $host;
        }

        location /cart {
            proxy_pass         http://cart-service:8002;
            proxy_set_header   Correlation-ID $correlation_id_final;
            proxy_set_header   Host $host;
        }

        location /inventory {
            proxy_pass         http://inventory-service:8003;
            proxy_set_header   Correlation-ID $correlation_id_final;
            proxy_set_header   Host $host;
        }

        location /payments {
            proxy_pass         http://payment-service:8004;
            proxy_set_header   Correlation-ID $correlation_id_final;
            proxy_set_header   Host $host;
        }

        location /orders {
            proxy_pass         http://order-service:8005;
            proxy_set_header   Correlation-ID $correlation_id_final;
            proxy_set_header   Host $host;
        }

        # ── Health-check shortcuts ────────────────────────────────────────────

        location = /product-health {
            proxy_pass       http://product-service:8001/health;
            proxy_set_header Correlation-ID $correlation_id_final;
        }

        location = /cart-health {
            proxy_pass       http://cart-service:8002/health;
            proxy_set_header Correlation-ID $correlation_id_final;
        }

        location = /inventory-health {
            proxy_pass       http://inventory-service:8003/health;
            proxy_set_header Correlation-ID $correlation_id_final;
        }

        location = /payment-health {
            proxy_pass       http://payment-service:8004/health;
            proxy_set_header Correlation-ID $correlation_id_final;
        }

        location = /order-health {
            proxy_pass       http://order-service:8005/health;
            proxy_set_header Correlation-ID $correlation_id_final;
        }
    }
}
